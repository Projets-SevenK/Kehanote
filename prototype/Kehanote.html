<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kehanote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600;1,9..144,700&family=Nunito:wght@400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --rose-50:  #FFF5F7;
  --rose-100: #FFE7EE;
  --rose-200: #FFD3DF;
  --rose-300: #FBB6C8;
  --rose-400: #F590AB;
  --rose-500: #EC6F92;
  --rose-600: #D9527A;
  --rose-700: #B53A60;
  --cream:    #FFFAF7;
  --paper:    #FFF8F4;
  --ink-900:  #2A1B26;
  --ink-700:  #4A3441;
  --ink-500:  #74606E;
  --ink-300:  #B5A4AF;
  --lav:      #C8B8DC;
  --peach:    #FFD9C4;
  --sage:     #BCD4C0;
  --gold:     #E8C57A;
  --bg:       #FFF5F7;
  --card:     #FFFFFF;
  --f-display: 'Fraunces', 'Cormorant Garamond', serif;
  --f-body:    'Nunito', 'SF Pro Rounded', system-ui, sans-serif;
  --r-sm: 12px; --r-md: 18px; --r-lg: 26px; --r-xl: 34px;
  --sh-soft: 0 2px 6px rgba(180,60,100,0.06), 0 12px 28px rgba(180,60,100,0.08);
  --sh-card: 0 1px 2px rgba(180,60,100,0.04), 0 6px 18px rgba(180,60,100,0.07);
  --sh-pop:  0 4px 12px rgba(217,82,122,0.18), 0 18px 40px rgba(217,82,122,0.18);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: var(--f-body);
  color: var(--ink-900);
  background: radial-gradient(80% 60% at 30% 20%, #FFE7EE 0%, transparent 60%), radial-gradient(70% 50% at 80% 80%, #EFE7F6 0%, transparent 60%), #F4E9EE;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px;
  -webkit-font-smoothing: antialiased;
}
#root { display: flex; align-items: center; justify-content: center; }
button { font-family: inherit; cursor: pointer; }
.kn-screen {
  position: absolute; inset: 0;
  background: radial-gradient(120% 80% at 50% -10%, #FFE2EB 0%, transparent 60%), radial-gradient(80% 60% at 100% 100%, #FFEEDD 0%, transparent 70%), var(--bg);
  overflow: hidden;
}
.kn-scroll { height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.kn-scroll::-webkit-scrollbar { display: none; }
.kn-wordmark { font-family: var(--f-display); font-weight: 600; letter-spacing: -0.02em; font-style: italic; }
.tap { -webkit-tap-highlight-color: transparent; user-select: none; }
@keyframes sparkle { 0%,100%{transform:scale(1) rotate(0deg);opacity:0.6} 50%{transform:scale(1.3) rotate(20deg);opacity:1} }
@keyframes float-y { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-6px)} }
@keyframes heart-pop { 0%{transform:scale(0);opacity:0} 40%{transform:scale(1.3);opacity:1} 100%{transform:scale(1);opacity:1} }
@keyframes confetti-fall { 0%{transform:translateY(-20px) rotate(0deg);opacity:1} 100%{transform:translateY(800px) rotate(720deg);opacity:0} }
@keyframes screen-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
@keyframes panic-pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
@keyframes wiggle { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }
.screen-anim { animation: screen-in 380ms cubic-bezier(.22,.9,.32,1.02); }
.float { animation: float-y 3.4s ease-in-out infinite; }
.btn-primary {
  background: linear-gradient(180deg, var(--rose-500), var(--rose-600));
  color: white; border: none; border-radius: 999px; padding: 16px 28px;
  font-weight: 800; font-size: 17px; letter-spacing: 0.01em;
  box-shadow: var(--sh-pop), inset 0 1px 0 rgba(255,255,255,0.35);
  transition: transform 120ms ease;
}
.btn-primary:active { transform: scale(0.97); }
.btn-ghost {
  background: rgba(255,255,255,0.7); color: var(--ink-900);
  border: 1px solid rgba(180,60,100,0.12); border-radius: 999px; padding: 14px 22px;
  font-weight: 700; font-size: 15px; backdrop-filter: blur(10px);
}
.kn-card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--sh-card); border: 1px solid rgba(180,60,100,0.05); }
.kn-tabbar {
  position: absolute; bottom: 18px; left: 12px; right: 12px; height: 64px;
  background: rgba(255,255,255,0.78); backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.7); border-radius: 28px; box-shadow: var(--sh-soft);
  display: flex; align-items: center; justify-content: space-around; padding: 0 8px; z-index: 30;
}
.kn-tab { flex:1; height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:20px; background:transparent; border:none; color:var(--ink-500); font-size:10px; font-weight:700; letter-spacing:0.02em; position:relative; transition:color 200ms; }
.kn-tab.active { color: var(--rose-600); }
.kn-tab.active::after { content:''; position:absolute; top:6px; width:36px; height:36px; border-radius:12px; background:var(--rose-100); z-index:-1; }
.chip { display:inline-flex; align-items:center; gap:6px; background:var(--rose-100); color:var(--rose-700); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:800; letter-spacing:0.04em; text-transform:uppercase; }
.chip.lav   { background:#EFE7F6; color:#6E5A8A; }
.chip.peach { background:#FFE4D6; color:#B55F30; }
.chip.sage  { background:#DDEDE1; color:#406B4D; }
.dot-divider { height:1px; background-image:linear-gradient(to right, var(--rose-200) 50%, transparent 50%); background-size:8px 1px; background-repeat:repeat-x; margin:14px 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script type="text/babel">

// iOS.jsx — Simplified iOS 26 (Liquid Glass) device frame
// Based on the iOS 26 UI Kit + Figma status bar spec. No assets, no deps.
// Exports: IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard

// ─────────────────────────────────────────────────────────────
// Status bar
// ─────────────────────────────────────────────────────────────
function IOSStatusBar({ dark = false, time = '9:41' }) {
  const c = dark ? '#fff' : '#000';
  return (
    <div style={{
      display: 'flex', gap: 154, alignItems: 'center', justifyContent: 'center',
      padding: '21px 24px 19px', boxSizing: 'border-box',
      position: 'relative', zIndex: 20, width: '100%',
    }}>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', paddingTop: 1.5 }}>
        <span style={{
          fontFamily: '-apple-system, "SF Pro", system-ui', fontWeight: 590,
          fontSize: 17, lineHeight: '22px', color: c,
        }}>{time}</span>
      </div>
      <div style={{ flex: 1, height: 22, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, paddingTop: 1, paddingRight: 1 }}>
        <svg width="19" height="12" viewBox="0 0 19 12">
          <rect x="0" y="7.5" width="3.2" height="4.5" rx="0.7" fill={c}/>
          <rect x="4.8" y="5" width="3.2" height="7" rx="0.7" fill={c}/>
          <rect x="9.6" y="2.5" width="3.2" height="9.5" rx="0.7" fill={c}/>
          <rect x="14.4" y="0" width="3.2" height="12" rx="0.7" fill={c}/>
        </svg>
        <svg width="17" height="12" viewBox="0 0 17 12">
          <path d="M8.5 3.2C10.8 3.2 12.9 4.1 14.4 5.6L15.5 4.5C13.7 2.7 11.2 1.5 8.5 1.5C5.8 1.5 3.3 2.7 1.5 4.5L2.6 5.6C4.1 4.1 6.2 3.2 8.5 3.2Z" fill={c}/>
          <path d="M8.5 6.8C9.9 6.8 11.1 7.3 12 8.2L13.1 7.1C11.8 5.9 10.2 5.1 8.5 5.1C6.8 5.1 5.2 5.9 3.9 7.1L5 8.2C5.9 7.3 7.1 6.8 8.5 6.8Z" fill={c}/>
          <circle cx="8.5" cy="10.5" r="1.5" fill={c}/>
        </svg>
        <svg width="27" height="13" viewBox="0 0 27 13">
          <rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke={c} strokeOpacity="0.35" fill="none"/>
          <rect x="2" y="2" width="20" height="9" rx="2" fill={c}/>
          <path d="M25 4.5V8.5C25.8 8.2 26.5 7.2 26.5 6.5C26.5 5.8 25.8 4.8 25 4.5Z" fill={c} fillOpacity="0.4"/>
        </svg>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Liquid glass pill — blur + tint + shine
// ─────────────────────────────────────────────────────────────
function IOSGlassPill({ children, dark = false, style = {} }) {
  return (
    <div style={{
      height: 44, minWidth: 44, borderRadius: 9999,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: dark
        ? '0 2px 6px rgba(0,0,0,0.35), 0 6px 16px rgba(0,0,0,0.2)'
        : '0 1px 3px rgba(0,0,0,0.07), 0 3px 10px rgba(0,0,0,0.06)',
      ...style,
    }}>
      {/* blur + tint */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.28)' : 'rgba(255,255,255,0.5)',
      }} />
      {/* shine */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 9999,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15), inset -1px -1px 1px rgba(255,255,255,0.08)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
      }} />
      <div style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', padding: '0 4px' }}>
        {children}
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Navigation bar — glass pills + large title
// ─────────────────────────────────────────────────────────────
function IOSNavBar({ title = 'Title', dark = false, trailingIcon = true }) {
  const muted = dark ? 'rgba(255,255,255,0.6)' : '#404040';
  const text = dark ? '#fff' : '#000';
  const pillIcon = (content) => (
    <IOSGlassPill dark={dark}>
      <div style={{ width: 36, height: 36, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        {content}
      </div>
    </IOSGlassPill>
  );
  return (
    <div style={{
      display: 'flex', flexDirection: 'column', gap: 10,
      paddingTop: 62, paddingBottom: 10, position: 'relative', zIndex: 5,
    }}>
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '0 16px',
      }}>
        {/* back chevron */}
        {pillIcon(
          <svg width="12" height="20" viewBox="0 0 12 20" fill="none" style={{ marginLeft: -1 }}>
            <path d="M10 2L2 10l8 8" stroke={muted} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        )}
        {/* trailing ellipsis */}
        {trailingIcon && pillIcon(
          <svg width="22" height="6" viewBox="0 0 22 6">
            <circle cx="3" cy="3" r="2.5" fill={muted}/>
            <circle cx="11" cy="3" r="2.5" fill={muted}/>
            <circle cx="19" cy="3" r="2.5" fill={muted}/>
          </svg>
        )}
      </div>
      {/* large title */}
      <div style={{
        padding: '0 16px',
        fontFamily: '-apple-system, system-ui',
        fontSize: 34, fontWeight: 700, lineHeight: '41px',
        color: text, letterSpacing: 0.4,
      }}>{title}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Grouped list (inset card, r:26) + row (52px)
// ─────────────────────────────────────────────────────────────
function IOSListRow({ title, detail, icon, chevron = true, isLast = false, dark = false }) {
  const text = dark ? '#fff' : '#000';
  const sec = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const ter = dark ? 'rgba(235,235,245,0.3)' : 'rgba(60,60,67,0.3)';
  const sep = dark ? 'rgba(84,84,88,0.65)' : 'rgba(60,60,67,0.12)';
  return (
    <div style={{
      display: 'flex', alignItems: 'center', minHeight: 52,
      padding: '0 16px', position: 'relative',
      fontFamily: '-apple-system, system-ui', fontSize: 17,
      letterSpacing: -0.43,
    }}>
      {icon && (
        <div style={{
          width: 30, height: 30, borderRadius: 7, background: icon,
          marginRight: 12, flexShrink: 0,
        }} />
      )}
      <div style={{ flex: 1, color: text }}>{title}</div>
      {detail && <span style={{ color: sec, marginRight: 6 }}>{detail}</span>}
      {chevron && (
        <svg width="8" height="14" viewBox="0 0 8 14" style={{ flexShrink: 0 }}>
          <path d="M1 1l6 6-6 6" stroke={ter} strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      )}
      {!isLast && (
        <div style={{
          position: 'absolute', bottom: 0, right: 0,
          left: icon ? 58 : 16, height: 0.5, background: sep,
        }} />
      )}
    </div>
  );
}

function IOSList({ header, children, dark = false }) {
  const hc = dark ? 'rgba(235,235,245,0.6)' : 'rgba(60,60,67,0.6)';
  const bg = dark ? '#1C1C1E' : '#fff';
  return (
    <div>
      {header && (
        <div style={{
          fontFamily: '-apple-system, system-ui', fontSize: 13,
          color: hc, textTransform: 'uppercase',
          padding: '8px 36px 6px', letterSpacing: -0.08,
        }}>{header}</div>
      )}
      <div style={{
        background: bg, borderRadius: 26,
        margin: '0 16px', overflow: 'hidden',
      }}>{children}</div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Device frame
// ─────────────────────────────────────────────────────────────
function IOSDevice({
  children, width = 402, height = 874, dark = false,
  title, keyboard = false,
}) {
  return (
    <div style={{
      width, height, borderRadius: 48, overflow: 'hidden',
      position: 'relative', background: dark ? '#000' : '#F2F2F7',
      boxShadow: '0 40px 80px rgba(0,0,0,0.18), 0 0 0 1px rgba(0,0,0,0.12)',
      fontFamily: '-apple-system, system-ui, sans-serif',
      WebkitFontSmoothing: 'antialiased',
    }}>
      {/* dynamic island */}
      <div style={{
        position: 'absolute', top: 11, left: '50%', transform: 'translateX(-50%)',
        width: 126, height: 37, borderRadius: 24, background: '#000', zIndex: 50,
      }} />
      {/* status bar (absolute) */}
      <div style={{ position: 'absolute', top: 0, left: 0, right: 0, zIndex: 10 }}>
        <IOSStatusBar dark={dark} />
      </div>
      {/* nav + content */}
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        {title !== undefined && <IOSNavBar title={title} dark={dark} />}
        <div style={{ flex: 1, overflow: 'auto' }}>{children}</div>
        {keyboard && <IOSKeyboard dark={dark} />}
      </div>
      {/* home indicator — always on top */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0, zIndex: 60,
        height: 34, display: 'flex', justifyContent: 'center', alignItems: 'flex-end',
        paddingBottom: 8, pointerEvents: 'none',
      }}>
        <div style={{
          width: 139, height: 5, borderRadius: 100,
          background: dark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.25)',
        }} />
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────────────────
// Keyboard — iOS 26 liquid glass
// ─────────────────────────────────────────────────────────────
function IOSKeyboard({ dark = false }) {
  const glyph = dark ? 'rgba(255,255,255,0.7)' : '#595959';
  const sugg = dark ? 'rgba(255,255,255,0.6)' : '#333';
  const keyBg = dark ? 'rgba(255,255,255,0.22)' : 'rgba(255,255,255,0.85)';

  // special-key icons
  const icons = {
    shift: <svg width="19" height="17" viewBox="0 0 19 17"><path d="M9.5 1L1 9.5h4.5V16h8V9.5H18L9.5 1z" fill={glyph}/></svg>,
    del: <svg width="23" height="17" viewBox="0 0 23 17"><path d="M7 1h13a2 2 0 012 2v11a2 2 0 01-2 2H7l-6-7.5L7 1z" fill="none" stroke={glyph} strokeWidth="1.6" strokeLinejoin="round"/><path d="M10 5l7 7M17 5l-7 7" stroke={glyph} strokeWidth="1.6" strokeLinecap="round"/></svg>,
    ret: <svg width="20" height="14" viewBox="0 0 20 14"><path d="M18 1v6H4m0 0l4-4M4 7l4 4" fill="none" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
  };

  const key = (content, { w, flex, ret, fs = 25, k } = {}) => (
    <div key={k} style={{
      height: 42, borderRadius: 8.5,
      flex: flex ? 1 : undefined, width: w, minWidth: 0,
      background: ret ? '#08f' : keyBg,
      boxShadow: '0 1px 0 rgba(0,0,0,0.075)',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontFamily: '-apple-system, "SF Compact", system-ui',
      fontSize: fs, fontWeight: 458, color: ret ? '#fff' : glyph,
    }}>{content}</div>
  );

  const row = (keys, pad = 0) => (
    <div style={{ display: 'flex', gap: 6.5, justifyContent: 'center', padding: `0 ${pad}px` }}>
      {keys.map(l => key(l, { flex: true, k: l }))}
    </div>
  );

  return (
    <div style={{
      position: 'relative', zIndex: 15, borderRadius: 27, overflow: 'hidden',
      padding: '11px 0 2px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      boxShadow: dark
        ? '0 -2px 20px rgba(0,0,0,0.09)'
        : '0 -1px 6px rgba(0,0,0,0.018), 0 -3px 20px rgba(0,0,0,0.012)',
    }}>
      {/* liquid glass bg — same recipe as nav pills */}
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        backdropFilter: 'blur(12px) saturate(180%)',
        WebkitBackdropFilter: 'blur(12px) saturate(180%)',
        background: dark ? 'rgba(120,120,128,0.14)' : 'rgba(255,255,255,0.25)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, borderRadius: 27,
        boxShadow: dark
          ? 'inset 1.5px 1.5px 1px rgba(255,255,255,0.15)'
          : 'inset 1.5px 1.5px 1px rgba(255,255,255,0.7), inset -1px -1px 1px rgba(255,255,255,0.4)',
        border: dark ? '0.5px solid rgba(255,255,255,0.15)' : '0.5px solid rgba(0,0,0,0.06)',
        pointerEvents: 'none',
      }} />

      {/* autocorrect bar */}
      <div style={{
        display: 'flex', gap: 20, alignItems: 'center',
        padding: '8px 22px 13px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {['"The"', 'the', 'to'].map((w, i) => (
          <React.Fragment key={i}>
            {i > 0 && <div style={{ width: 1, height: 25, background: '#ccc', opacity: 0.3 }} />}
            <div style={{
              flex: 1, textAlign: 'center',
              fontFamily: '-apple-system, system-ui', fontSize: 17,
              color: sugg, letterSpacing: -0.43, lineHeight: '22px',
            }}>{w}</div>
          </React.Fragment>
        ))}
      </div>

      {/* key layout */}
      <div style={{
        display: 'flex', flexDirection: 'column', gap: 13,
        padding: '0 6.5px', width: '100%', boxSizing: 'border-box',
        position: 'relative',
      }}>
        {row(['q','w','e','r','t','y','u','i','o','p'])}
        {row(['a','s','d','f','g','h','j','k','l'], 20)}
        <div style={{ display: 'flex', gap: 14.25, alignItems: 'center' }}>
          {key(icons.shift, { w: 45, k: 'shift' })}
          <div style={{ display: 'flex', gap: 6.5, flex: 1 }}>
            {['z','x','c','v','b','n','m'].map(l => key(l, { flex: true, k: l }))}
          </div>
          {key(icons.del, { w: 45, k: 'del' })}
        </div>
        <div style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          {key('ABC', { w: 92.25, fs: 18, k: 'abc' })}
          {key('', { flex: true, k: 'space' })}
          {key(icons.ret, { w: 92.25, ret: true, k: 'ret' })}
        </div>
      </div>

      {/* bottom spacer (emoji+mic area, icons omitted) */}
      <div style={{ height: 56, width: '100%', position: 'relative' }} />
    </div>
  );
}

Object.assign(window, {
  IOSDevice, IOSStatusBar, IOSNavBar, IOSGlassPill, IOSList, IOSListRow, IOSKeyboard,
});
// Sample content for Kehanote — Communication / Journalism studies

const SUBJECTS = [
  {
    id: 'theo-info',
    title: "Théories de l'information",
    teacher: "M. Lefèvre",
    progress: 0.72,
    color: 'rose',
    icon: 'book',
    chapters: 8,
    cards: 42,
    next: "Mardi 14:00",

function ProgressRing({ value = 0, size = 44, stroke = 4, color = 'var(--rose-500)' }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
      <circle cx={size/2} cy={size/2} r={r} fill="none"
        stroke="var(--rose-100)" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none"
        stroke={color} strokeWidth={stroke} strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={c * (1 - value)}
        style={{ transition: 'stroke-dashoffset 800ms cubic-bezier(.22,.9,.32,1.02)' }}/>
    </svg>
  );
}

// Swipe & Retiens — draggable flashcards. Drag right = je connais, left = je ne connais pas.

function Flashcards({ subject, onBack, onComplete }) {
  const cards = FLASHCARDS[subject.id] || [];
  const [idx, setIdx] = React.useState(0);
  const [flipped, setFlipped] = React.useState(false);
  const [drag, setDrag] = React.useState({ x: 0, y: 0, active: false });
  const [feedback, setFeedback] = React.useState(null); // 'know' | 'unsure' | null
  const [score, setScore] = React.useState({ know: 0, unsure: 0 });
  const startRef = React.useRef({ x: 0, y: 0 });

  const card = cards[idx];
  const isLast = idx >= cards.length;

  const startDrag = (clientX, clientY) => {
    startRef.current = { x: clientX, y: clientY };
    setDrag({ x: 0, y: 0, active: true });
  };
  const moveDrag = (clientX, clientY) => {
    if (!drag.active) return;
    setDrag({ x: clientX - startRef.current.x, y: clientY - startRef.current.y, active: true });
  };
  const endDrag = () => {
    if (!drag.active) return;
    const threshold = 80;
    if (Math.abs(drag.x) > threshold) {
      const dir = drag.x > 0 ? 'know' : 'unsure';
      setFeedback(dir);
      setScore(s => ({ ...s, [dir]: s[dir] + 1 }));
      // Animate out then advance
      setDrag({ x: drag.x > 0 ? 500 : -500, y: drag.y, active: false });
      setTimeout(() => {
        setDrag({ x: 0, y: 0, active: false });
        setFlipped(false);
        setFeedback(null);
        setIdx(i => i + 1);
      }, 320);
    } else {
      setDrag({ x: 0, y: 0, active: false });

// Challenge — QCM with difficulty selection + scoring system
//
// Scoring (cf. SCORING in data.jsx):
//   +1   for correct
//   -0.5 for wrong
//   -0.25 for skip
// Final raw score is multiplied by level.multiplier and rescaled to /20.
// Best score per (subject, level) is persisted to localStorage so Kehane
// can see her progress day after day.

const STORAGE_KEY = 'kehanote.challenge.history.v1';

function loadHistory() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
  } catch { return {}; }
}
function saveHistory(h) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); } catch {}
}
function recordRun(subjectId, levelId, scoreOn20) {
  const h = loadHistory();
  const key = `${subjectId}__${levelId}`;
  const today = new Date().toISOString().slice(0, 10);
  const entry = h[key] || { best: 0, runs: [] };
  entry.best = Math.max(entry.best || 0, scoreOn20);
  entry.runs = [...(entry.runs || []), { date: today, score: scoreOn20 }].slice(-30);
  h[key] = entry;
  saveHistory(h);
  return entry;
}
function readBest(subjectId, levelId) {
  const h = loadHistory();
  return h[`${subjectId}__${levelId}`]?.best || 0;
}

// ── Outer component: routes between difficulty picker and the actual quiz ──
function Challenge({ subject, onBack, onComplete }) {
  const [level, setLevel] = React.useState(null);

  if (!level) {
    return <DifficultyPicker subject={subject} onBack={onBack} onPick={setLevel} />;
  }
  return <Quiz
    subject={subject}
    level={level}
    onBack={() => setLevel(null)}
    onComplete={onComplete}
  />;
}

// ── Actual quiz ────────────────────────────────────────────────────────────
function Quiz({ subject, level, onBack, onComplete }) {
  // Filter to questions of the chosen level, capped at level.target
  const questions = React.useMemo(() => {
    const pool = (QCM[subject.id] || []).filter(q => q.level === level.id);
    return pool.slice(0, level.target);
  }, [subject.id, level.id]);

  const [idx, setIdx] = React.useState(0);
  const [picked, setPicked] = React.useState(null);
  const [answers, setAnswers] = React.useState([]); // {status: 'correct'|'wrong'|'skip', picked?: i}

  const q = questions[idx];
  const isLast = idx >= questions.length;

  const tally = React.useMemo(() => {
    let raw = 0, c = 0, w = 0, s = 0;
    answers.forEach(a => {
      if (a.status === 'correct') { raw += SCORING.correct; c++; }
      else if (a.status === 'wrong') { raw += SCORING.wrong; w++; }
      else if (a.status === 'skip') { raw += SCORING.skip; s++; }
    });
    return { raw, c, w, s };
  }, [answers]);

  const onPick = (i) => {
    if (picked !== null) return;
    setPicked(i);
    const correct = i === q.correct;
    setAnswers(a => [...a, { status: correct ? 'correct' : 'wrong', picked: i }]);
  };

  const onSkip = () => {
    if (picked !== null) return;
    setAnswers(a => [...a, { status: 'skip' }]);
    advance();
  };

  const advance = () => {
    setPicked(null);
    if (idx + 1 >= questions.length) {
      // Finished — compute final
      finalize();
    } else {
      setIdx(i => i + 1);
    }
  };

  const next = () => advance();

  const finalize = () => {
    // Build final answers list including the one we just added (state may not be flushed)
    const finalAnswers = answers; // already up-to-date if called from advance after setAnswers
    let raw = 0, c = 0, w = 0, s = 0;
    finalAnswers.forEach(a => {
      if (a.status === 'correct') { raw += SCORING.correct; c++; }
      else if (a.status === 'wrong') { raw += SCORING.wrong; w++; }
      else if (a.status === 'skip') { raw += SCORING.skip; s++; }
    });
    // Convert raw (max = questions.length) to /20, applying level multiplier
    const maxRaw = questions.length * SCORING.correct;
    const normalized = Math.max(0, raw) / maxRaw; // clamp at 0 — never negative grade
    const scoreOn20 = Math.min(20, normalized * 20 * level.multiplier);
    const rounded = Math.round(scoreOn20 * 10) / 10;
    const history = recordRun(subject.id, level.id, rounded);
    onComplete({
      score: rounded,
      total: 20,
      counts: { correct: c, wrong: w, skip: s, n: questions.length },
      level,
      best: history.best,
      isNewBest: rounded >= history.best,
    });
  };

  // Use an effect to finalize once we hit the end (state-flush safe)
  React.useEffect(() => {
    if (isLast && questions.length > 0) {
      let raw = 0, c = 0, w = 0, s = 0;
      answers.forEach(a => {
        if (a.status === 'correct') { raw += SCORING.correct; c++; }
        else if (a.status === 'wrong') { raw += SCORING.wrong; w++; }
        else if (a.status === 'skip') { raw += SCORING.skip; s++; }
      });
      const maxRaw = questions.length * SCORING.correct;
      const normalized = Math.max(0, raw) / maxRaw;
      const scoreOn20 = Math.min(20, normalized * 20 * level.multiplier);
      const rounded = Math.round(scoreOn20 * 10) / 10;
      const prevBest = readBest(subject.id, level.id);
      const isNewBest = rounded > prevBest;
      const history = recordRun(subject.id, level.id, rounded);
      onComplete({
        score: rounded,
        total: 20,
        counts: { correct: c, wrong: w, skip: s, n: questions.length },
        level,
        best: history.best,
        isNewBest,
      });
    }
  }, [isLast]);

  if (questions.length === 0) {
    return <div className="kn-screen screen-anim" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div>Pas encore de QCM pour ce niveau.</div>
    </div>;
  }
  if (isLast) return null;

  return (
    <div className="kn-screen screen-anim">
      <div className="kn-scroll" style={{ paddingTop: 60, paddingBottom: 130 }}>
        {/* Top bar */}
        <div style={{ padding: '0 18px 8px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <button className="tap" onClick={onBack} style={{
            width: 40, height: 40, borderRadius: '50%',
            background: 'white', border: '1px solid rgba(180,60,100,0.08)',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: 'var(--sh-card)',
          }}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M9 2L3 7l6 5" stroke="var(--ink-700)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
          <div style={{ textAlign: 'center' }}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, fontSize: 11, fontWeight: 800, letterSpacing: '0.12em', color: level.color, textTransform: 'uppercase' }}>
              <span>{level.icon}</span> {level.label}
            </div>

              {idx + 1} / {questions.length}
            </div>
          </div>
          <div style={{

            background: tally.raw >= 0 ? 'rgba(188, 212, 192, 0.25)' : 'rgba(252, 220, 230, 0.7)',
            border: `1px solid ${tally.raw >= 0 ? 'rgba(188, 212, 192, 0.6)' : 'var(--rose-300)'}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            color: tally.raw >= 0 ? '#2C5A38' : 'var(--rose-700)',
            fontWeight: 800, fontSize: 13, fontVariantNumeric: 'tabular-nums',
          }}>
            {tally.raw > 0 ? '+' : ''}{tally.raw.toFixed(2).replace(/\.?0+$/, '')}
          </div>
        </div>

        {/* Progress */}
        <div style={{ padding: '0 24px', marginBottom: 24 }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {questions.map((_, i) => (
              <div key={i} style={{
                flex: 1, height: 6, borderRadius: 3,
                background: i < idx
                  ? (answers[i]?.status === 'correct' ? 'var(--rose-500)'
                    : answers[i]?.status === 'wrong' ? 'var(--lav)'
                    : '#D8D0E4')
                  : i === idx
                  ? 'var(--rose-300)'
                  : 'var(--rose-100)',
              }}/>
            ))}
          </div>
        </div>

        {/* Question card */}
        <div style={{ padding: '0 18px' }}>
          <div className="kn-card" style={{ padding: 22, marginBottom: 16 }}>
            <span className="chip lav" style={{ marginBottom: 14, display: 'inline-flex' }}>Question {idx + 1}</span>
            <h2 style={{
              fontFamily: 'var(--f-display)', fontWeight: 500, fontStyle: 'italic',
              fontSize: 23, lineHeight: 1.25, margin: '4px 0 0',
              letterSpacing: '-0.01em', textWrap: 'balance',
            }}>{q.q}</h2>
          </div>

          {/* Choices */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {q.choices.map((c, i) => {
              const isPicked = picked === i;
              const isCorrect = i === q.correct;
              const showResult = picked !== null;
              let bg = 'white';
              let border = 'rgba(180,60,100,0.08)';
              let color = 'var(--ink-900)';
              let label = String.fromCharCode(65 + i);
              let labelBg = 'var(--rose-100)';
              let labelColor = 'var(--rose-700)';
              if (showResult && isCorrect) {
                bg = '#EAF7EE'; border = 'var(--sage)'; labelBg = 'var(--sage)'; labelColor = '#2C5A38';
              } else if (showResult && isPicked && !isCorrect) {
                bg = '#FBE7EC'; border = 'var(--rose-300)'; labelBg = 'var(--rose-400)'; labelColor = 'white';
              }
              return (
                <button key={i} className="tap" onClick={() => onPick(i)} disabled={showResult} style={{
                  textAlign: 'left', padding: '14px 16px',
                  background: bg, border: `1.5px solid ${border}`,
                  borderRadius: 'var(--r-md)',
                  display: 'flex', alignItems: 'center', gap: 12,
                  fontSize: 15, fontWeight: 600, color,
                  cursor: showResult ? 'default' : 'pointer',
                  transition: 'all 240ms ease',
                  animation: `screen-in 380ms ${i * 60}ms backwards`,
                }}>
                  <span style={{
                    width: 28, height: 28, borderRadius: 8,
                    background: labelBg, color: labelColor,
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontWeight: 800, fontSize: 13, flexShrink: 0,
                  }}>{showResult && isCorrect ? '✓' : showResult && isPicked && !isCorrect ? '✕' : label}</span>
                  <span style={{ flex: 1, textWrap: 'pretty' }}>{c}</span>
                </button>
              );
            })}
          </div>

          {/* Feedback */}
          {picked !== null && (
            <div style={{
              marginTop: 16, padding: 16,
              background: picked === q.correct ? 'rgba(188, 212, 192, 0.25)' : 'rgba(252, 220, 230, 0.6)',
              borderRadius: 'var(--r-md)',
              display: 'flex', gap: 12, alignItems: 'flex-start',
              animation: 'screen-in 320ms',
            }}>
              <Mochi size={48} mood={picked === q.correct ? 'hooray' : 'sad'} />
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 800, fontSize: 14, marginBottom: 4, color: picked === q.correct ? '#2C5A38' : 'var(--rose-700)' }}>
                  {picked === q.correct ? `Bravo, c'est ça ! +${SCORING.correct}` : `Pas tout à fait. ${SCORING.wrong}`}
                </div>
                <div style={{ fontSize: 13, color: 'var(--ink-700)', lineHeight: 1.5, textWrap: 'pretty' }}>
                  {q.explain}
                </div>
              </div>
            </div>
          )}
        </div>
      </div>

      {/* Bottom CTAs */}
      <div style={{ position: 'absolute', bottom: 96, left: 18, right: 18, display: 'flex', flexDirection: 'column', gap: 8 }}>
        {picked !== null ? (
          <button className="btn-primary tap" onClick={next}>
            {idx + 1 >= questions.length ? "Voir mon score" : "Question suivante"}
          </button>
        ) : (
          <button className="tap" onClick={onSkip} style={{
            width: '100%',
            padding: '12px 16px',
            background: 'rgba(255,255,255,0.7)',
            border: '1px dashed rgba(110, 90, 138, 0.4)',
            color: '#6E5A8A',
            borderRadius: 'var(--r-md)',
            fontSize: 13, fontWeight: 700,
          }}>
            Passer cette question · −0,25
          </button>
        )}
      </div>
    </div>
  );
}

// Lets user switch between subjects via a picker pill row.
function Panic({ subject, onBack }) {

    : (ratio >= 0.8 ? 'great' : ratio >= 0.5 ? 'good' : 'gentle');

  const confetti = React.useMemo(() => Array.from({ length: 32 }, (_, i) => ({
    left: Math.random() * 100,

    great:  { t: "Magnifique.",     s: "Tu maîtrises ce chapitre. Sérieusement, c'est impressionnant." },
    good:   { t: "Très bien joué.", s: "Encore un passage et ce sera ancré pour de bon." },

            borderRadius: i % 3 === 0 ? '50%' : 2,

          {/* Personal note from Nini */}
          <div style={{
            marginTop: 18, padding: '16px 20px',
            background: 'rgba(255,255,255,0.85)', backdropFilter: 'blur(10px)',

            <p style={{

      <div style={{ position: 'absolute', bottom: 56, left: 28, right: 28, display: 'flex', flexDirection: 'column', gap: 10 }}>
        <button className="btn-primary tap" onClick={onContinue}>
          Continuer
        </button>
      </div>
    </div>
  );

// All Cards screen — big subject cards containing their lessons (chapters).
function AllCards({ onOpenSubject, onOpenLesson }) {
  const [query, setQuery] = React.useState('');
  const [filter, setFilter] = React.useState('all');
  const [expanded, setExpanded] = React.useState(null);

  // Synthesize lessons per subject (each subject -> chapters with cards count + status)
  const SUBJECT_LESSONS = React.useMemo(() => {
    const lessonNames = {
      'theo-info': [
        "Modèle de Shannon", "Lasswell & ses limites", "Cybernétique de Wiener",
        "École de Palo Alto", "Théorie des deux étages", "Médiologie",
        "Communication & sens", "Synthèse",
      ],
      'socio-medias': [
        "Agenda-setting", "Cultivation theory", "Spirale du silence",
        "Usages & gratifications", "Sociologie de la réception", "Synthèse critique",
      ],
      'ecriture': [
        "La pyramide inversée", "Le lead & les 5W", "L'attaque & la chute",
        "Style direct & verbes actifs", "Réécriture",
      ],
      'droit-presse': [
        "Loi de 1881", "Diffamation", "Droit à l'image", "RGPD & journalisme",
        "Sources & secret professionnel", "Responsabilité éditoriale", "Cas pratiques",
      ],
    };
    return SUBJECTS.map(s => {
      const names = lessonNames[s.id] || [];
      const totalCards = (FLASHCARDS[s.id] || []).length;
      // distribute cards roughly equal across chapters
      const lessons = names.slice(0, s.chapters).map((name, i) => {
        const r = (i + 0.5) / s.chapters;
        let status = 'new';
        if (r < s.progress - 0.1) status = 'learned';
        else if (r < s.progress + 0.1) status = 'review';
        const cards = Math.max(3, Math.round(totalCards / s.chapters) + (i % 2 ? 1 : 0));
        return { id: `${s.id}-${i}`, name, cards, status, idx: i };
      });
      return { ...s, lessons };
    });
  }, []);

  const subjBg = (s) =>
    s.color === 'rose'  ? 'linear-gradient(155deg, #FFD3DF, #F590AB)'
  : s.color === 'lav'   ? 'linear-gradient(155deg, #EFE7F6, #C8B8DC)'
  : s.color === 'peach' ? 'linear-gradient(155deg, #FFE4D6, #FFC09E)'
  :                       'linear-gradient(155deg, #DDEDE1, #BCD4C0)';

  const subjAccent = (s) =>
    s.color === 'rose'  ? 'var(--rose-600)'
  : s.color === 'lav'   ? '#6E5A8A'
  : s.color === 'peach' ? '#B55F30'
  :                       '#406B4D';

  // filter logic
  const filteredSubjects = SUBJECT_LESSONS.map(s => {
    const lessons = s.lessons.filter(l => {
      const m = !query
        || l.name.toLowerCase().includes(query.toLowerCase())
        || s.title.toLowerCase().includes(query.toLowerCase());
      const f = filter === 'all' || l.status === filter;
      return m && f;
    });
    return { ...s, lessons };
  }).filter(s => s.lessons.length > 0);

  const allLessons = SUBJECT_LESSONS.flatMap(s => s.lessons);
  const counts = {
    all: allLessons.length,
    learned: allLessons.filter(l => l.status === 'learned').length,
    review: allLessons.filter(l => l.status === 'review').length,
    new: allLessons.filter(l => l.status === 'new').length,
  };

  const filters = [
    { id: 'all', label: 'Tout', dot: 'var(--ink-300)' },
    { id: 'learned', label: 'Apprises', dot: 'var(--rose-500)' },
    { id: 'review', label: 'À revoir', dot: '#C8B8DC' },
    { id: 'new', label: 'Nouvelles', dot: '#E8C57A' },
  ];

  const statusMeta = (s) => s === 'learned'
    ? { color: 'var(--rose-500)', label: 'Apprise' }
    : s === 'review'
    ? { color: '#9784B0', label: 'À revoir' }
    : { color: '#B89240', label: 'Nouvelle' };

  return (
    <div className="kn-screen screen-anim">
      <div className="kn-scroll" style={{ paddingTop: 60, paddingBottom: 110 }}>
        {/* Header */}
        <div style={{ padding: '8px 24px 16px' }}>
          <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: '0.12em', color: 'var(--rose-600)', textTransform: 'uppercase' }}>
            Tes leçons
          </div>
          <h1 style={{
            fontFamily: 'var(--f-display)', fontWeight: 500, fontStyle: 'italic',
            fontSize: 30, margin: '6px 0 0', lineHeight: 1.05, letterSpacing: '-0.01em',
          }}>Par matière</h1>
        </div>

        {/* Search bar */}
        <div style={{ padding: '0 18px 12px' }}>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 10,
            padding: '12px 14px',
            background: 'white',
            border: '1px solid rgba(180,60,100,0.08)',
            borderRadius: 'var(--r-md)',
            boxShadow: 'var(--sh-card)',
          }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style={{ flexShrink: 0 }}>
              <circle cx="11" cy="11" r="7" stroke="var(--ink-500)" strokeWidth="2"/>
              <path d="M20 20l-3.5-3.5" stroke="var(--ink-500)" strokeWidth="2" strokeLinecap="round"/>
            </svg>
            <input
              type="text"
              placeholder="Rechercher une leçon, une matière…"
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              style={{
                flex: 1, border: 'none', outline: 'none', background: 'transparent',
                fontFamily: 'inherit', fontSize: 15, color: 'var(--ink-900)',
                fontWeight: 600, minWidth: 0,
              }}
            />
            {query && (
              <button className="tap" onClick={() => setQuery('')} style={{
                width: 22, height: 22, borderRadius: '50%',
                background: 'var(--rose-100)', border: 'none',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                color: 'var(--rose-700)', fontSize: 11, fontWeight: 800,
                flexShrink: 0,
              }}>✕</button>
            )}
          </div>
        </div>

        {/* Filter chips */}
        <div style={{
          display: 'flex', gap: 8, padding: '0 18px 14px',
          overflowX: 'auto', scrollbarWidth: 'none',
        }}>
          {filters.map(f => (
            <button key={f.id} className="tap" onClick={() => setFilter(f.id)} style={{
              flexShrink: 0,
              padding: '8px 14px',
              background: filter === f.id ? 'var(--rose-500)' : 'white',
              color:      filter === f.id ? 'white' : 'var(--ink-700)',
              border: filter === f.id ? 'none' : '1px solid rgba(180,60,100,0.1)',
              borderRadius: 999,
              fontSize: 13, fontWeight: 800,
              display: 'flex', alignItems: 'center', gap: 6,
              boxShadow: filter === f.id ? 'var(--sh-pop)' : 'none',
              transition: 'all 200ms',
              whiteSpace: 'nowrap',
            }}>
              <span style={{
                width: 6, height: 6, borderRadius: '50%',
                background: filter === f.id ? 'white' : f.dot,
              }}/>
              {f.label}
              <span style={{
                fontSize: 11,
                opacity: filter === f.id ? 0.85 : 0.55,
              }}>{counts[f.id]}</span>
            </button>
          ))}
        </div>

        {/* Empty state */}
        {filteredSubjects.length === 0 ? (
          <div style={{ padding: '40px 32px', textAlign: 'center' }}>
            <Mochi size={100} mood="sleepy" />
            <div style={{ fontFamily: 'var(--f-display)', fontStyle: 'italic', fontSize: 20, marginTop: 12 }}>
              Aucune leçon trouvée
            </div>
            <p style={{ fontSize: 13, color: 'var(--ink-500)', marginTop: 6 }}>
              Essaie un autre mot-clé ou un autre filtre.
            </p>
          </div>
        ) : (
          <div style={{ padding: '0 18px', display: 'flex', flexDirection: 'column', gap: 14 }}>
            {filteredSubjects.map((s, si) => {
              const isOpen = expanded === s.id || query.length > 0 || filter !== 'all';
              const learnedCount = s.lessons.filter(l => l.status === 'learned').length;
              return (
                <div key={s.id} className="kn-card" style={{
                  overflow: 'hidden', padding: 0,
                  animation: `screen-in 460ms ${si * 80}ms backwards cubic-bezier(.22,.9,.32,1.02)`,
                }}>
                  {/* Subject header */}
                  <button className="tap"
                    onClick={() => setExpanded(expanded === s.id ? null : s.id)}
                    style={{
                      width: '100%', border: 'none', textAlign: 'left',
                      background: subjBg(s),
                      padding: 18,
                      display: 'flex', alignItems: 'center', gap: 14,
                      position: 'relative',
                    }}>
                    <div style={{
                      width: 52, height: 52, borderRadius: 16,
                      background: 'rgba(255,255,255,0.65)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      flexShrink: 0,
                    }}>
                      <SubjectIcon icon={s.icon} />
                    </div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{
                        fontFamily: 'var(--f-display)', fontStyle: 'italic',
                        fontSize: 19, fontWeight: 600, color: 'var(--ink-900)',
                        lineHeight: 1.15, letterSpacing: '-0.01em',
                        textWrap: 'balance',
                      }}>{s.title}</div>
                      <div style={{
                        fontSize: 12, color: subjAccent(s),
                        fontWeight: 800, marginTop: 4,
                        display: 'flex', alignItems: 'center', gap: 8,
                        whiteSpace: 'nowrap',
                      }}>
                        <span style={{ flexShrink: 0 }}>{s.lessons.length} leçons</span>
                        <span style={{ opacity: 0.4, flexShrink: 0 }}>•</span>
                        <span style={{ flexShrink: 0 }}>{learnedCount}/{s.lessons.length} ✓</span>
                      </div>
                    </div>
                    {/* Chevron */}
                    <div style={{
                      width: 32, height: 32, borderRadius: '50%',
                      background: 'rgba(255,255,255,0.7)',

                      flexShrink: 0,

                      transition: 'transform 280ms',
                    }}>
                      <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
                        <path d="M5 2l6 5-6 5" stroke={subjAccent(s)} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"/>
                      </svg>
                    </div>
                  </button>

                  {/* Lessons (collapsible) */}
                  {isOpen && (
                    <div style={{ padding: 12, display: 'flex', flexDirection: 'column', gap: 6 }}>
                      {s.lessons.map((l, li) => {

                        return (

                              border: 'none', textAlign: 'left',
                              background: 'rgba(255, 245, 247, 0.5)',
                              borderRadius: 14, padding: '12px 14px',
                              display: 'flex', alignItems: 'center', gap: 12,
                              animation: `screen-in 320ms ${li * 30}ms backwards`,
                            }}>
                            <div style={{
                              width: 28, height: 28, borderRadius: 9,
                              background: 'white',
                              display: 'flex', alignItems: 'center', justifyContent: 'center',
                              flexShrink: 0,
                              border: `1px solid ${sm.color}30`,
                              fontSize: 11, fontWeight: 800,
                              color: subjAccent(s),
                            }}>{l.idx + 1}</div>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{
                                fontSize: 14, fontWeight: 700, color: 'var(--ink-900)',
                                whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis',
                              }}>{l.name}</div>
                              <div style={{
                                fontSize: 11, color: 'var(--ink-500)',
                                display: 'flex', alignItems: 'center', gap: 8, marginTop: 2,
                                whiteSpace: 'nowrap',
                              }}>
                                <span style={{ flexShrink: 0 }}>{l.cards} cartes</span>
                                <span style={{ opacity: 0.4, flexShrink: 0 }}>•</span>
                                <span style={{
                                  display: 'inline-flex', alignItems: 'center', gap: 4,
                                  color: sm.color, fontWeight: 800,
                                  whiteSpace: 'nowrap', flexShrink: 0,
                                }}>
                                  <span style={{ width: 5, height: 5, borderRadius: '50%', background: sm.color }}/>
                                  {sm.label}
                                </span>
                              </div>
                            </div>
                            <svg width="12" height="12" viewBox="0 0 14 14" fill="none" style={{ flexShrink: 0, opacity: 0.35 }}>
                              <path d="M5 2l6 5-6 5" stroke="var(--ink-700)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                            </svg>

        )}

// ── TweaksPanel minimal stub (no host protocol needed for standalone) ──────
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null ? keyOrEdits : { [keyOrEdits]: val };
    setValues(prev => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}
function TweaksPanel({ children }) { return null; }
function TweakSection({ children }) { return null; }
function TweakRadio() { return null; }
function TweakSelect() { return null; }
function TweakSlider() { return null; }
function TweakButton() { return null; }

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [route, setRoute] = React.useState({ name: 'onboarding' });
  const [tab, setTab] = React.useState('home');

  const go = (r) => setRoute(r);
  const startApp = () => go({ name: 'home' });

  let screen = null;
  if (route.name === 'onboarding') {
    screen = <Onboarding onStart={startApp} tweaks={tweaks} />;
  } else if (route.name === 'home') {
    if (tab === 'home') {
      screen = <Home
        onOpenSubject={(s) => go({ name: 'subject', subject: s })}
        onPanic={() => go({ name: 'panic', subject: SUBJECTS[0] })}
        onPlayMode={() => go({ name: 'subject', subject: SUBJECTS[0] })}
      />;
    } else if (tab === 'cards') {
      screen = <AllCards onOpenSubject={(s) => go({ name: 'flashcards', subject: s })} />;
    } else if (tab === 'profile') {
      screen = <Profile />;
    }
  } else if (route.name === 'subject') {
    screen = <SubjectHub
      subject={route.subject}
      onBack={() => go({ name: 'home' })}
      onMode={(m) => {
        if (m === 'concentre') go({ name: 'concentre', subject: route.subject });
        if (m === 'swipe') go({ name: 'flashcards', subject: route.subject });
        if (m === 'challenge') go({ name: 'challenge', subject: route.subject });
      }}
      onPanic={() => go({ name: 'panic', subject: route.subject })}
    />;
  } else if (route.name === 'concentre') {
    screen = <Concentre subject={route.subject} onBack={() => go({ name: 'subject', subject: route.subject })} />;
  } else if (route.name === 'flashcards') {
    screen = <Flashcards
      subject={route.subject}
      onBack={() => go({ name: 'subject', subject: route.subject })}
      onComplete={(score) => go({ name: 'reward', subject: route.subject, score: score.know, total: score.know + score.unsure, mode: 'swipe' })}
    />;
  } else if (route.name === 'challenge') {
    screen = <Challenge
      subject={route.subject}
      onBack={() => go({ name: 'subject', subject: route.subject })}
      onComplete={(payload) => go({ name: 'reward', subject: route.subject, ...payload, mode: 'qcm' })}
    />;
  } else if (route.name === 'panic') {
    screen = <Panic subject={route.subject} onBack={() => go({ name: route.fromHub ? 'subject' : 'home', subject: route.subject })} />;
  } else if (route.name === 'reward') {
    screen = <Reward
      subject={route.subject}
      score={route.score} total={route.total} mode={route.mode}
      counts={route.counts} level={route.level}
      best={route.best} isNewBest={route.isNewBest}
      onContinue={() => go({ name: 'home' })}
    />;
  }

  const showTabs = route.name === 'home';

  return (
    <IOSDevice width={402} height={874} dark={false}>
      <div style={{ position: 'absolute', inset: 0 }} key={route.name + (route.subject?.id || '') + tab}>
        {screen}
        {showTabs && <Nav active={tab} onSelect={setTab} />}
      </div>
    </IOSDevice>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
